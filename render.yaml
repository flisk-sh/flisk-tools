# Render Blueprint on the free plan: render.com → New → Blueprint → flisk-sh/flisk-tools. No database and
# no API keys to fill in. See DEPLOY.md.
services:
  - type: web
    name: flisk-tools
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /ready
    # No `domains:` here: the workspace's two free custom domains are taken, so tools.flisk.si is served by the
    # Cloudflare Worker in cloudflare/, which forwards to this service's onrender.com address (see DEPLOY.md).
    envVars:
      # The address people use (tools.flisk.si, through the Cloudflare Worker), for canonical links and the sitemap.
      - key: PUBLIC_URL
        value: https://tools.flisk.si/
      - key: TRUST_PROXY
        value: last-forwarded
