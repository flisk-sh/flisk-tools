# Deploy: cd cloudflare && bunx wrangler@4 deploy
# The custom domain needs no DNS record of its own; Cloudflare creates it. Delete a plain CNAME for `tools` first.
name = "tools-proxy"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "tools.flisk.si", custom_domain = true }]
