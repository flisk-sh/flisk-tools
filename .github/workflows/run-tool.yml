name: Run Tool
# Dispatched by the console with the signed-in person's own token, so it runs in their fork on their free Actions
# minutes. The run name carries the ticket, which is how the console finds this run; the result goes to the `results`
# branch of the same repository as <ticket>.json.
run-name: ${{ inputs.tool }} ${{ inputs.ticket }}

on:
  workflow_dispatch:
    inputs:
      tool:
        description: Folder name under tools/
        required: true
      input:
        description: The Tool's input as JSON
        required: false
        default: "{}"
      ticket:
        description: Random id of this run
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Run the Tool
        run: bun tools/run.ts
        env:
          TOOL: ${{ inputs.tool }}
          INPUT: ${{ inputs.input }}
          TICKET: ${{ inputs.ticket }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the result
        env:
          TICKET: ${{ inputs.ticket }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dir="$(mktemp -d)"
          if git ls-remote --exit-code --heads "$remote" results >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch results "$remote" "$dir"
          else
            git init --quiet "$dir"
            git -C "$dir" checkout --quiet -b results
            git -C "$dir" remote add origin "$remote"
          fi
          cp "out/${TICKET}.json" "$dir/"
          cd "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit --quiet -m "Result ${TICKET}"
          git push --quiet origin results
