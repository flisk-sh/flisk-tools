# tools.flisk.si runs on Cloudflare Workers. Deploy: bunx wrangler@4 deploy
# The custom domain needs no DNS record of its own; Cloudflare creates it.
name = "flisk-tools"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
routes = [{ pattern = "tools.flisk.si", custom_domain = true }]

[vars]
PUBLIC_URL = "https://tools.flisk.si/"
TRUST_PROXY = "cloudflare"
